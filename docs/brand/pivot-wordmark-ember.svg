<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- PIVOT repo hero: the wordmark over an ember ring (the O as the light source) and two orbits, on the kiln -->
  <defs>
    <linearGradient id="ember" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#ff6a13"/><stop offset="1" stop-color="#b8260b"/></linearGradient>
    <filter id="lift" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .1"/></feComponentTransfer></filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#0c0806" stop-opacity="0"/><stop offset="1" stop-color="#0c0806" stop-opacity=".85"/></radialGradient>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <linearGradient id="ringgrad" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#ff6a13"/><stop offset="1" stop-color="#b8260b"/></linearGradient>
    <g id="bg"><rect width="1280" height="640" fill="#0c0806"/><circle cx="640" cy="320" r="250" fill="none" stroke="url(#ringgrad)" stroke-width="90" filter="url(#haze)" opacity=".85"/>
    <circle cx="640" cy="320" r="250" fill="none" stroke="#ffb347" stroke-opacity=".35" stroke-width="1.5"/>
    <g fill="none" stroke="#4a3527" stroke-width="1.2"><ellipse cx="640" cy="320" rx="560" ry="120" transform="rotate(-12 640 320)"/><ellipse cx="640" cy="320" rx="470" ry="190" transform="rotate(18 640 320)"/></g>
    <circle cx="1166" cy="211" r="4" fill="#ffb347"/></g>
  </defs>
  <use href="#bg"/>
  <rect width="1280" height="640" fill="url(#vignette)"/>
  <rect width="1280" height="640" filter="url(#grain)"/>
  
  <!-- PIVOT wordmark: ember P, Warm White letters, ember O -->
  <!-- a soft dark halo lifts the letters off the ring -->
  <g transform="translate(288.4 238.4) scale(1.2)" fill="#0c0806" filter="url(#lift)" opacity=".75">
    <path d="M0 0H94A40 34 0 0 1 134 34H22A22 34 0 0 1 0 0ZM22 68H134A40 34 0 0 1 94 102H34V116A20 20 0 0 1 14 136H0V90A22 22 0 0 1 22 68ZM96 33H134V69H96Z"/><path d="M0 0H34V110A26 26 0 0 1 8 136H0Z" transform="translate(154 0)"/><path d="M0 0H36L64 94L92 0H128L84 136H44Z" transform="translate(206 0)"/><path d="M68 0A68 68 0 1 1 68 136A68 68 0 1 1 68 0ZM68 34A34 34 0 1 0 68 102A34 34 0 1 0 68 34Z" transform="translate(342 0)" fill-rule="evenodd"/><path d="M0 0H98V34H50V110A26 26 0 0 1 24 136H16V34H0Z" transform="translate(488 0)"/>
  </g>
  <g transform="translate(288.4 238.4) scale(1.2)" fill="#fbf3ea">
    <path d="M68 0A68 68 0 1 1 68 136A68 68 0 1 1 68 0ZM68 34A34 34 0 1 0 68 102A34 34 0 1 0 68 34Z" transform="translate(342 0)" fill-rule="evenodd" fill="url(#ember)" filter="url(#bloom)" opacity=".8"/>
    <path fill="#ff6a13" d="M0 0H94A40 34 0 0 1 134 34H22A22 34 0 0 1 0 0ZM22 68H134A40 34 0 0 1 94 102H34V116A20 20 0 0 1 14 136H0V90A22 22 0 0 1 22 68ZM96 33H134V69H96Z"/><path d="M0 0H34V110A26 26 0 0 1 8 136H0Z" transform="translate(154 0)"/><path d="M0 0H36L64 94L92 0H128L84 136H44Z" transform="translate(206 0)"/><path d="M68 0A68 68 0 1 1 68 136A68 68 0 1 1 68 0ZM68 34A34 34 0 1 0 68 102A34 34 0 1 0 68 34Z" transform="translate(342 0)" fill-rule="evenodd" fill="url(#ember)"/><path d="M0 0H98V34H50V110A26 26 0 0 1 24 136H16V34H0Z" transform="translate(488 0)"/>
  </g>
</svg>
