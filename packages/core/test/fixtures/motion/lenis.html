<!doctype html>
<!-- A smooth-scrolled page like Lenis (window.lenis, lerp 0.1), for motion-track.test.ts. It is scrolled with the wheel. -->
<html class="lenis">
  <head>
    <meta charset="utf-8" />
    <title>Motion fixture: smooth scroll</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
      }
      #content {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 3600px;
        will-change: transform;
      }
      .box {
        position: absolute;
        left: 100px;
        width: 600px;
        height: 300px;
        background: #2a6;
      }
      /* 500 ms ease-in-out when it comes into view */
      #late {
        top: 1800px;
        opacity: 0;
        transition: opacity 500ms ease-in-out;
      }
      #late.in {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="content">
      <div class="box" id="top">Top</div>
      <div class="box" id="late">Late</div>
    </div>
    <script>
      const content = document.getElementById("content");
      const max = 3600 - innerHeight;
      let target = 0,
        current = 0;
      window.lenis = { options: { lerp: 0.1, smoothWheel: true } };
      addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          target = Math.max(0, Math.min(max, target + e.deltaY));
        },
        { passive: false },
      );
      const tick = () => {
        current += (target - current) * 0.1;
        if (Math.abs(target - current) < 0.1) current = target;
        content.style.transform = `translateY(${-current}px)`;
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      const late = document.getElementById("late");
      const io = new IntersectionObserver(
        (es) => {
          if (es[0].isIntersecting) late.classList.add("in");
        },
        { threshold: 0.5 },
      );
      io.observe(late);
    </script>
  </body>
</html>
